<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackerTube 中文 · 值得看的技术视频</title>
<meta name="description" content="Hacker News 反复推荐的技术视频，中文标题、中文导读与社区讨论。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://i.ytimg.com">
<script>
try {
  const t = JSON.parse(localStorage.getItem('ht.theme') || 'null');
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
} catch {}
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/watch.css">
<link rel="stylesheet" href="css/enhancements.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<button class="skip-link" type="button" id="skip-link">跳到主要内容</button>

<header class="app-bar">
  <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <a class="brand" href="#/" aria-label="HackerTube 中文首页">
    Hacker<span class="brand-accent">Tube</span><span class="brand-tag">中文</span>
  </a>

  <form class="search" id="search-form" role="search">
    <label class="visually-hidden" for="search-input">搜索视频</label>
    <input id="search-input" type="search" placeholder="搜索视频、频道、字幕" autocomplete="off">
    <kbd class="search-kbd" id="search-kbd" aria-hidden="true">/</kbd>
    <button class="search-clear" id="search-clear" type="button" aria-label="清除搜索" hidden>×</button>
    <button class="search-btn" type="submit" aria-label="搜索">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </form>

  <nav class="app-actions" aria-label="快捷入口">
    <button class="icon-btn" id="random-btn" type="button" aria-label="随机看一个" title="随机看一个">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
        <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
        <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/>
        <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/>
      </svg>
    </button>
    <a class="icon-btn" href="#/saved" aria-label="收藏" title="收藏">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    </a>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
      <svg class="theme-icon-moon" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <svg class="theme-icon-sun" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="设置" aria-haspopup="dialog" aria-expanded="false" title="设置">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/>
      </svg>
    </button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <nav class="nav">
      <a class="nav-item" data-route="feed" href="#/">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <polygon points="10.2,10.2 15.8,8.2 13.8,13.8 8.2,15.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span>发现</span>
      </a>
      <a class="nav-item" data-route="series" href="#/series">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          <polygon points="17,14.5 21,17 17,19.5" fill="currentColor"/>
        </svg>
        <span>系列合集</span>
      </a>
      <a class="nav-item" data-route="saved" href="#/saved">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
        </svg>
        <span>收藏</span>
      </a>
      <a class="nav-item" data-route="history" href="#/history">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <path d="M12 7.5V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>已浏览</span>
      </a>
      <a class="nav-item" data-scope="all" href="#/feed?all=1">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
          <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
        </svg>
        <span>全部内容</span>
      </a>

      <hr class="nav-divider">
      <p class="nav-heading">主题</p>
      <div class="nav-group" id="area-nav"></div>

        <a href="https://github.com/FJWangYantao/hackertube-zh/blob/main/CHANGELOG.md"

      </p>
    </nav>
  </aside>

  <div class="scrim" id="scrim" hidden></div>
  <main class="view" id="view" tabindex="-1">
    <section class="feed is-skeleton" aria-hidden="true">
      <div class="grid">
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
        <article class="card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-text"><span class="sk-line"></span><span class="sk-line sk-short"></span><span class="sk-line sk-tiny"></span></div></div></article>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
